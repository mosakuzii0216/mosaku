<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <!-- ブラウザの枠の色。初めて開く人は夜の書斎なので、その地の色にそろえる -->
    <meta name="theme-color" content="#141720" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Zen+Old+Mincho:wght@600&display=swap"
    />
    <script>
      (function () {
        try {
          // 保存が無い・知らない値(前に選べたダークなど)なら夜の書斎。
          // theme.tsのTHEMESとDEFAULT_THEMEにそろえる
          var t = localStorage.getItem("mosaku-theme");
          if (t !== "mori" && t !== "light") t = "yoru";
          document.documentElement.setAttribute("data-theme", t);
          // 上の帯の色も、テーマの地の色に。theme.tsのTHEME_COLORSにそろえる
          var colors = { yoru: "#141720", mori: "#0e1a17", light: "#faf6ee" };
          document
            .querySelector('meta[name="theme-color"]')
            .setAttribute("content", color[t]);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
