name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: mosaku
          POSTGRES_PASSWORD: mosaku
          POSTGRES_DB: mosaku
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://mosaku:mosaku@localhost:5432/mosaku?schema=public
      COOKIE_SECRET: ci-test-secret

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      # generated/prisma は gitignore されているので CI で作る
      - run: npx prisma generate
        working-directory: backend

      - run: npx prisma migrate deploy
        working-directory: backend

      - run: npm test
      - run: npm run -w backend test:e2e

  playwright:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: mosaku
          POSTGRES_PASSWORD: mosaku
          POSTGRES_DB: mosaku
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://mosaku:mosaku@localhost:5432/mosaku?schema=public
      COOKIE_SECRET: ci-test-secret

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - run: npx prisma generate
        working-directory: backend

      - run: npx prisma migrate deploy
        working-directory: backend

      # テスト用のChrome本体と、Linuxで動かすのに要る部品を入れる
      - run: npx playwright install --with-deps chromium

      - run: npm run test:playwright

      # 落ちたときだけ、traceを後からダウンロードできるように残す
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-traces
          path: test-results/

  deploy:
    needs: [test, playwright]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    # WIF でトークンを受け取るのに必要
    permissions:
      contents: read
      id-token: write

    # 同時デプロイを防ぐ
    concurrency:
      group: deploy-backend
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx prisma generate
        working-directory: backend

      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/129805115778/locations/global/workloadIdentityPools/github/providers/github
          service_account: github-actions@igneous-core-480923-j0.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: igneous-core-480923-j0

      - name: Migrate production DB
        working-directory: backend
        run: |
          DATABASE_URL="$(gcloud secrets versions access latest --secret=mosaku-database-url)" \
            npx prisma migrate deploy

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy mosaku-backend \
            --source . \
            --region asia-northeast1 \
            --allow-unauthenticated \
          --set-secrets=DATABASE_URL=mosaku-database-url:latest,COOKIE_SECRET=mosaku-cookie-secret:latest,GOOGLE_CLIENT_SECRET=google-client-secret:latest \
          --set-env-vars=^@^NODE_ENV=production@CORS_ORIGIN=https://mosaku.jp,http://localhost:5173@RP_ID=mosaku.jp@RP_ORIGIN=https://mosaku.jp@GOOGLE_CLIENT_ID=129805115778-hu55soqdadebugtbpf2mrqoji155hgea.apps.googleusercontent.com@GOOGLE_REDIRECT_URI=https://api.mosaku.jp/auth/google/callback@FRONTEND_URL=https://mosaku.jp

      - name: Verify
        run: curl -fsS https://api.mosaku.jp/health
